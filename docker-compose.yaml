services:
  kvm-init:
    image: alpine:3
    container_name: viber-kvm-init
    privileged: true
    pid: host
    restart: "no"
    command: >
      nsenter -t 1 -m -u -i -n -p --
      sh -c "modprobe kvm_amd 2>/dev/null || modprobe kvm_intel 2>/dev/null || true; ls -l /dev/kvm"

  android-emulator:
    image: shmayro/dockerify-android:1.0.0
    container_name: android-emulator
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    volumes:
      - android-data:/data
      - ./emulator/first-boot.sh:/overrides/first-boot.sh:ro
    command:
      - sh
      - -c
      - "tr -d '\\r' < /overrides/first-boot.sh > /root/first-boot.sh && chmod +x /root/first-boot.sh && exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    environment:
      - GAPPS_SETUP=${GAPPS_SETUP:-true}
      - ROOT_SETUP=${ROOT_SETUP:-true}
      - SCREEN_RESOLUTION=${EMULATOR_SCREEN_RESOLUTION:-1280x720}
      - SCREEN_DENSITY=${EMULATOR_SCREEN_DENSITY:-240}
      - RAM_SIZE=${EMULATOR_RAM_SIZE:-3072}
    depends_on:
      kvm-init:
        condition: service_completed_successfully
    restart: unless-stopped

  scrcpy-web:
    image: shmayro/scrcpy-web:latest
    container_name: scrcpy-web
    privileged: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${SCRCPY_WEB_PORT:-8000}:8000"
    depends_on:
      android-emulator:
        condition: service_healthy
    command: >
      sh -c "adb connect $${ADB_HOST:-android-emulator}:$${ADB_PORT:-5555} && npm start"
    restart: unless-stopped

  appium:
    image: appium/appium:latest
    container_name: viber-appium
    environment:
      - RELAXED_SECURITY=true
      - REMOTE_ADB=true
      - ANDROID_DEVICES=${ADB_HOST:-android-emulator}:${ADB_PORT:-5555}
    depends_on:
      android-emulator:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: viber-rabbitmq
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-viber}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-viber_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: viber-bot
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-viber}:${RABBITMQ_PASS:-viber_secret}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}?heartbeat=60
      - APPIUM_HOST=${APPIUM_HOST:-appium}
      - APPIUM_PORT=${APPIUM_PORT:-4723}
      - ANDROID_SERIAL=${ADB_HOST:-android-emulator}:${ADB_PORT:-5555}
      - ADB_BIN=adb
      - VIBER_PACKAGE=com.viber.voip
      - VIBER_MESSAGES_DB=/data/data/com.viber.voip/databases/viber_messages
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
    volumes:
      - viber-bot-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      android-emulator:
        condition: service_healthy
      appium:
        condition: service_started

  viber-parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viber-parser-api
    restart: unless-stopped
    depends_on:
      android-emulator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ADB_HOST=${ADB_HOST:-android-emulator}
      - ADB_PORT=${ADB_PORT:-5555}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-viber}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-viber_secret}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
    volumes:
      - ./apk:/apk:ro

volumes:
  android-data:
  viber-bot-data:
  rabbitmq_data:

