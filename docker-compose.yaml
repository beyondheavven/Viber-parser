services:
  kvm-init:
    image: alpine:3
    container_name: viber-kvm-init
    privileged: true
    pid: host
    restart: "no"
    command: >
      nsenter -t 1 -m -u -i -n -p --
      sh -c "modprobe kvm_amd 2>/dev/null || modprobe kvm_intel 2>/dev/null || true; ls -l /dev/kvm"

  android-emulator:
    # Pinned: emulator/first-boot.sh is a fork of this exact tag's script.
    image: shmayro/dockerify-android:1.0.0
    container_name: android-emulator
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    ports:
      - "${EMULATOR_ADB_PORT}:5555"
      - "${EMULATOR_VNC_PORT}:6080"
    volumes:
      - android-data:/data
      - ./emulator/first-boot.sh:/overrides/first-boot.sh:ro
      - ./emulator/entrypoint.sh:/overrides/entrypoint.sh:ro
      - ./emulator/setup-device-profile.sh:/overrides/setup-device-profile.sh:ro
    # The image re-runs first-boot.sh on every start, and its stock version
    # switches airplane mode on and lets the screen sleep after 15s — both
    # racing with (and overriding) whatever start.sh sets. Our fork is copied
    # over it here; `tr` strips the CR a Windows checkout may have added.
    # (List form on purpose: a string command is shell-split by compose, which
    # would eat the backslash in '\r'.)
    command:
      - sh
      - -c
      - "tr -d '\\r' < /overrides/entrypoint.sh > /root/entrypoint.sh && chmod +x /root/entrypoint.sh && exec /root/entrypoint.sh"
    environment:
      # The image ships a single system image (android-30, default x86_64);
      # the Android version is not configurable through it.
      - GAPPS_SETUP=${GAPPS_SETUP:-true}
      - ROOT_SETUP=${ROOT_SETUP:-true}
      - DEVICE_PROFILE=${DEVICE_PROFILE:-samsung-tab-s7}
      # Display and memory, mirroring LDPlayer's "Tablet" preset (1280x720 at
      # 240 dpi), which is the layout the Viber page objects were captured on.
      # Applied to /data/android.avd/config.ini on every container start, so a
      # change only needs `docker compose up -d android-emulator`, not a new
      # data volume.
      - SCREEN_RESOLUTION=${EMULATOR_SCREEN_RESOLUTION:-1280x720}
      - SCREEN_DENSITY=${EMULATOR_SCREEN_DENSITY:-240}
      - RAM_SIZE=${EMULATOR_RAM_SIZE:-4096}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-50101}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_TYPE=${PROXY_TYPE:-socks5}
    depends_on:
      kvm-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "adb shell 'test \"$(getprop sys.boot_completed)\" = 1 && test -f /data/local/tmp/.viber-device-profile-ready-v1'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s
    restart: unless-stopped

  scrcpy-web:
    image: shmayro/scrcpy-web:latest
    container_name: scrcpy-web
    privileged: true
    ports:
      - "8000:8000"
    depends_on:
      android-emulator:
        condition: service_healthy
    command: >
      sh -c "adb connect android-emulator:5555 && npm start"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  emulator-agent:
    build:
      context: services/emulator-agent
      dockerfile: Dockerfile
    container_name: viber-emulator-agent
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/kvm:/dev/kvm
      - /lib/modules:/lib/modules:ro
    environment:
      - PORT=9000
      - AGENT_SECRET=${VPS_AGENT_SECRET:-viber-secret-agent-token}
      - HOST_PUBLIC_IP=${HOST_PUBLIC_IP:-136.92.24.88}
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-/home/kkurzau/Viber-parser}
      - EMULATOR_IMAGE=${EMULATOR_IMAGE:-shmayro/dockerify-android:1.0.0}
      - ADB_PORT_START=5556
      - ADB_PORT_END=5599
      - VNC_PORT_START=6081
      - VNC_PORT_END=6120
      - SCRCPY_PORT=8000
      - COMPANION_NETWORK=${COMPANION_NETWORK:-viber-parser_default}
      - COMPANION_APPIUM_IMAGE=${COMPANION_APPIUM_IMAGE:-appium/appium:latest}
      - COMPANION_BOT_IMAGE=${COMPANION_BOT_IMAGE:-viber-parser-bot}
      - COMPANION_RABBITMQ_URL=amqp://${RABBITMQ_USER:-viber}:${RABBITMQ_PASS:-viber_secret}@rabbitmq:5672?heartbeat=60
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
      - VIBER_DEFAULT_NAME=${VIBER_DEFAULT_NAME:-Maks}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  appium:
    image: appium/appium:latest
    container_name: viber-appium
    ports:
      - "4723:4723"
    environment:
      - RELAXED_SECURITY=true
      - REMOTE_ADB=true
      - ANDROID_DEVICES=android-emulator:5555
    depends_on:
      android-emulator:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: viber-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-viber}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-viber_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: viber-bot
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-viber}:${RABBITMQ_PASS:-viber_secret}@rabbitmq:5672?heartbeat=60
      - APPIUM_HOST=appium
      - APPIUM_PORT=4723
      - ANDROID_SERIAL=android-emulator:5555
      - ADB_BIN=adb
      - VIBER_PACKAGE=com.viber.voip
      - VIBER_MESSAGES_DB=/data/data/com.viber.voip/databases/viber_messages
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
      - VIBER_DEFAULT_NAME=${VIBER_DEFAULT_NAME:-Maks}
    volumes:
      - viber-bot-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      android-emulator:
        condition: service_healthy
      appium:
        condition: service_started

  viber-parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viber-parser-api
    restart: unless-stopped
    depends_on:
      android-emulator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ADB_HOST=${ADB_HOST:-android-emulator}
      - ADB_PORT=${ADB_PORT:-5555}
      - DEVICE_PROFILE=${DEVICE_PROFILE:-samsung-tab-s7}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-viber}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-viber_secret}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
    volumes:
      - ./apk:/apk:ro

volumes:
  android-data:
  viber-bot-data:
  rabbitmq_data:

