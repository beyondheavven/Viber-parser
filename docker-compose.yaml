services:
  android-emulator:
    image: shmayro/dockerify-android:latest
    container_name: android-emulator
    privileged: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    ports:
      - "${EMULATOR_ADB_PORT}:5555"
      - "${EMULATOR_VNC_PORT}:6080"
    volumes:
      - viber-db:${VIBER_EMULATOR_DB_PATH}
      - android-data:/data
    environment:
      - EMULATOR_SYSTEM_IMAGE=${ANDROID_IMAGE}
      - ANDROID_PLATFORM_VERSION=${ANDROID_VERSION}
    restart: unless-stopped

  scrcpy-web:
    image: shmayro/scrcpy-web:latest
    container_name: scrcpy-web
    privileged: true
    ports:
      - "8000:8000"
    depends_on:
      android-emulator:
        condition: service_healthy
    command: >
      sh -c "adb connect android-emulator:5555 && npm start"
    restart: unless-stopped

  appium:
    image: appium/appium:latest
    container_name: viber-appium
    ports:
      - "4723:4723"
    environment:
      - RELAXED_SECURITY=true
      - REMOTE_ADB=true
      - ANDROID_DEVICES=android-emulator:5555
    depends_on:
      android-emulator:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: viber-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-viber}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-viber_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: viber-bot
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-viber}:${RABBITMQ_PASS:-viber_secret}@rabbitmq:5672?heartbeat=60
      - APPIUM_HOST=appium
      - APPIUM_PORT=4723
      - ANDROID_SERIAL=android-emulator:5555
      - ADB_BIN=adb
      - VIBER_PACKAGE=com.viber.voip
      - VIBER_MESSAGES_DB=/data/data/com.viber.voip/databases/viber_messages
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
    volumes:
      # Collected rosters and monitored messages are written here, and
      # /api/tasks/{id}/participants reads the list back out of the saved file —
      # without this the results die with the container.
      - viber-bot-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      android-emulator:
        condition: service_healthy
      appium:
        condition: service_started

  viber-parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viber-parser-api
    restart: unless-stopped
    depends_on:
      android-emulator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ADB_HOST=${ADB_HOST:-android-emulator}
      - ADB_PORT=${ADB_PORT:-5555}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-viber}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-viber_secret}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - VIBER_DEFAULT_PHONE=${VIBER_DEFAULT_PHONE:-}
      - VIBER_DEFAULT_COUNTRY=${VIBER_DEFAULT_COUNTRY:-}
    volumes:
      - viber-db:${VIBER_API_DB_MOUNT}
      - ./apk:/apk:ro

volumes:
  viber-db:
  android-data:
  viber-bot-data:
  rabbitmq_data:

