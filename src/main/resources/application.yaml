ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.viber.plugins.StatusPagesKt.configureStatusPages
      - com.viber.routes.RoutingKt.configureRouting
      - com.viber.plugins.MonitoringKt.configureMonitoring
      - com.viber.plugins.SerializationKt.configureSerialization
      - com.viber.plugins.OpenApiKt.configureOpenApi
      - com.viber.supabase.SupabaseClientKt.configureSupabaseClient

adb:
  host: "$ADB_HOST:android-emulator"
  port: "$ADB_PORT:5555"
  connectRetries: "$ADB_CONNECT_RETRIES:30"

rabbitmq:
  host: "$RABBITMQ_HOST:localhost"
  port: "$RABBITMQ_PORT:5672"
  user: "$RABBITMQ_USER:user"
  password: "$RABBITMQ_PASS:viber_secret"
  queue: "$RABBITMQ_QUEUE:viber_commands_queue"
  timeoutSeconds: "$RABBITMQ_TIMEOUT_SECONDS:60"

supabase:
  url: "$SUPABASE_URL:"
  key: "$SUPABASE_SERVICE_KEY:"
