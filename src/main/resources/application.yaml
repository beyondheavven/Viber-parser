ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.viber.plugins.KoinKt.configureDI
      - com.viber.plugins.ExceptionHandlerKt.configureException
      - com.viber.routes.RoutingKt.configureRouting
      - com.viber.plugins.MonitoringKt.configureMonitoring
      - com.viber.plugins.SerializationKt.configureSerialization
      - com.viber.plugins.OpenApiKt.configureOpenApi
      - com.viber.supabase.SupabaseClientKt.configureSupabaseClient
      - com.viber.plugins.TaskEventConsumerPluginKt.configureTaskEventConsumer

adb:
  host: "$ADB_HOST:android-emulator"
  port: "$ADB_PORT:5555"
  connectRetries: "$ADB_CONNECT_RETRIES:30"

rabbitmq:
  host: "$RABBITMQ_HOST:localhost"
  port: "$RABBITMQ_PORT:5672"
  user: "$RABBITMQ_USER:user"
  password: "$RABBITMQ_PASS:viber_secret"
  queue: "$RABBITMQ_QUEUE:viber_commands_queue"
  eventsQueue: "$RABBITMQ_EVENTS_QUEUE:viber_events_queue"
  timeoutSeconds: "$RABBITMQ_TIMEOUT_SECONDS:60"

supabase:
  url: "$SUPABASE_URL:"
  key: "$SUPABASE_SERVICE_KEY:"

users:
  # Auto-upload every finished collect task to Supabase. false disables it.
  autosync: "$USERS_AUTOSYNC:true"
