ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.viber.routes.RoutingKt.configureRouting
      - com.viber.plugins.MonitoringKt.configureMonitoring
      - com.viber.plugins.SerializationKt.configureSerialization
      - com.viber.plugins.OpenApiKt.configureOpenApi
      - com.viber.supabase.SupabaseClientKt.configureSupabaseClient

adb:
  host: "$ADB_HOST:android-emulator"
  port: "$ADB_PORT:5555"
  connectRetries: "$ADB_CONNECT_RETRIES:30"

frida:
  serverPath: "$FRIDA_SERVER_PATH:/data/local/tmp/frida-server"
  version: "$FRIDA_VERSION:16.1.4"
  deviceName: "$FRIDA_DEVICE_NAME:android-emulator"

database:
  path: "$VIBER_DB_PATH:/mnt/viber-db/viber_messages"
  queryTimeoutSeconds: "$VIBER_DB_QUERY_TIMEOUT_SECONDS:60"
  writeTimeoutSeconds: "$VIBER_DB_WRITE_TIMEOUT_SECONDS:120"
  backupOnWrite: "$VIBER_DB_BACKUP_ON_WRITE:true"

supabase:
  url: "$SUPABASE_URL"
  key: "$SUPABASE_SERVICE_KEY"
